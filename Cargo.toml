[package]
name = "todot"
version = "2026.8.1"
edition = "2024"
description = "A Chinese todo.txt terminal app with reproducible Linux builds"
license = "MIT"
repository = "https://github.com/YevinDong/todot"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4.44"
crossterm = "0.29.0"
getrandom = "0.2"
notify = "8"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
tiny_http = "0.12"

# Keep terminal replies in the same input parser as keyboard/paste events.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[dev-dependencies]
insta = "1.47"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
